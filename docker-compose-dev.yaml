name: opencombas

# Unified stack: a single MongoDB shared as the source of truth, with both the combas UDP server and the
# Xenia-WebServices HTTP API pointed at it. Run from this directory: `docker compose up --build`.
#
# Service hostnames resolve on the `opencombas` network, so both apps reach Mongo at mongo:27017.
# Xenia's Mongoose URI has no database path, so it uses the "test" database; the combas server is told
# the same via MONGO_DATABASE. Give both an explicit shared db later by adding a path to each URI.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017" # exposed to the host for inspection (mongosh / Compass)
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - opencombas

  combas-server:
    build:
      context: .
    restart: unless-stopped
    environment:
      MONGO_URI: "mongodb://mongo:27017/"
      MONGO_DATABASE: "test"
    volumes:
      - ./config.toml:/app/config.toml
    ports:
      # All combas UDP services (see config.toml). Published as a range so newly-added ports work too.
      - "1201-1300:1201-1300/udp"
      - "9090:9090" # Prometheus metrics
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      opencombas:
        ipv4_address: 172.20.0.150

  # Standalone ChromeHounds read-only HTTP API (active players by nation, etc.). Same image as combas-server,
  # just a different entrypoint; reads the shared Mongo. GET http://<host>:8099/api/players-by-nation
  chapi:
    build:
      context: .
    restart: unless-stopped
    entrypoint: ["/app/chapi"]
    environment:
      MONGO_URI: "mongodb://mongo:27017/"
      MONGO_DATABASE: "test"
      CH_API_LISTEN: ":8099"
    volumes:
      - ./config.toml:/app/config.toml
    ports:
      - "8099:8099"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - opencombas

  webservices:
    # Xenia-WebServices is vendored as a git submodule under external/. It ships a lowercase `dockerfile`;
    # name it explicitly so it builds on case-sensitive filesystems (Docker otherwise looks for `Dockerfile`).
    build:
      context: ./external/Xenia-WebServices
      dockerfile: dockerfile
    restart: unless-stopped
    environment:
      API_PORT: "36000"
      MONGO_URI: "mongodb://mongo:27017/"
      SWAGGER_API: "true"
      nginx: "false"
      xstorage: "true"
    ports:
      - "36000:36000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      opencombas:
        ipv4_address: 172.20.0.5

  gns-relay:
    build:
      context: ./external/xenia-gns-relay
      dockerfile: Dockerfile.relay
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://gns-relay:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - opencombas
    command: ["--path", "/relay", "--addr", "0.0.0.0:8080"]

  gns-gateway:
    build:
      context: ./external/xenia-gns-relay
      dockerfile: Dockerfile.gateway
      args:
        XENIA_REF: "netplay_canary_experimental_linux"
    depends_on:
      gns-relay:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - opencombas
    command: ["--server-ip", "${COMBAS_IP}", "--signaling-url", "ws://gns-relay:8080/relay", "--loopback", "combas-server"]

  nginx_proxy:
    image: nginx:latest
    container_name: nginx_reverse_proxy
    ports:
      - "80:80"
    environment:
      - WS_IP=172.20.0.5
    volumes:
      - ./resources/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./resources/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - webservices
    network_mode: "host"


volumes:
  mongo-data:

networks:
  opencombas:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "0.0.0.0"
    ipam:
      config:
        - subnet: 172.20.0.0/16
