# Promtail: tails the stack's container logs (via the Docker socket) and ships them DIRECTLY to the Loki
# backend's push API — NOT through xenia-log-ingest (that's only for client-uploaded gzip logs). Labels stay
# low-cardinality: environment (prod/testenv, from $ENVIRONMENT) + job=combas-stack + container + stream
# (stdout/stderr). Multiple deployments ship to one shared Loki; filter in Grafana by environment/container.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /promtail/positions.yaml

clients:
  # Loki push endpoint (e.g. https://monitoring.opencombas.org/loki/api/v1/push — the /loki/ route on the
  # monitoring edge nginx preserves the /loki prefix). Sourced from $LOKI_PUSH_URL; requires promtail to run
  # with `-config.expand-env=true` (set in docker-compose). The /loki route is guarded by basic_auth on
  # the monitoring edge; creds are env-sourced (set LOKI_USERNAME / LOKI_PASSWORD in .env).
  - url: ${LOKI_PUSH_URL}
    basic_auth:
      username: ${LOKI_USERNAME}
      password: ${LOKI_PASSWORD}

scrape_configs:
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/?(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      - target_label: job
        replacement: combas-stack
      # Distinguishes deployments (prod vs testenv) on the shared Loki. From $ENVIRONMENT (config.expand-env).
      - target_label: environment
        replacement: ${ENVIRONMENT}
