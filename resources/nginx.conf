user www-data;
worker_processes auto;
worker_cpu_affinity auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
        worker_connections 768;
}

http {


        sendfile on;
        tcp_nopush on;
        types_hash_max_size 2048;
        server_tokens build; # Recommended practice is to turn this off

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        ssl_protocols TLSv1.2 TLSv1.3; # Dropping SSLv3 (POODLE), TLS 1.0, 1.1
        ssl_prefer_server_ciphers off; # Don't force server cipher order.

        # Query-stripped access log: the default 'combined' format logs "$request" (with the query string),
        # and auth tokens ride in `?token=` on the /events WS URL — logging $uri (path only) keeps bearer
        # tokens out of the access logs. See Xenia-WebServices adr-0002.
        log_format  api  '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent "$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log api;

        gzip on;

        include /etc/nginx/conf.d/*.conf;
        include /etc/nginx/sites-enabled/*;
        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''        close;
        }

}
